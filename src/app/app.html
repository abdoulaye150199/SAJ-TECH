<div class="intro-curtain" aria-hidden="true"><img src="/assets/Saj.png" alt="" /></div>
<div class="scroll-progress" aria-hidden="true"></div>

@if (content(); as site) {
  <app-site-header
    [navigation]="site.navigation"
    [scrolled]="scrolled()"
    [menuOpen]="menuOpen()"
    (navigate)="navigateTo($event)"
    (menuToggle)="toggleMenu()"
  />

  <main>
    <app-hero-section (navigate)="navigateTo($event)" />
    <app-statement-section (navigate)="navigateTo($event)" />
    <app-services-section [services]="site.services" />
    <app-team-section [members]="site.team" />
    <app-reviews-section [testimonials]="site.testimonials" />
    <app-contact-section [brand]="site.brand" [contact]="site.contact" />
  </main>

  <app-site-footer [year]="currentYear" (navigate)="navigateTo($event)" />
}
